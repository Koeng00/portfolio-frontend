<div class="card">
    <h3>{{project.title}}</h3>
    <p>{{project.description}}</p>
    <div class="tect-stack">
        <span *ngFor="let tech of project.techStack" class="tect-tag">{{tech}}</span>
    </div>
    <a *ngIf="project.githubUrl" [href]="project.githubUrl" target="_blank">View on GitHub</a>
</div>
